<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>全科複習 — 國語・英文・數學・自然・社會</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 id="homeLink">全科複習</h1>
  <div class="topbar-controls">
    <button id="themeBtn" class="chip" title="選擇色系">🎨</button>
    <button id="subjectBtn" class="chip" title="切換科目"></button>
    <button id="phonToggle" class="chip" title="切換注音/拼音">注音</button>
    <button id="gradeBtn" class="chip" title="選擇年級（可多選）"></button>
  </div>
</header>
<div id="gradePanel" class="grade-panel hidden"></div>
<div id="themePanel" class="theme-panel hidden"></div>

<main>
<!-- 科目選擇（進站先選年級+科目） -->
<section id="view-subject" class="view hidden">
  <div class="quiz-head"><span></span><span>選擇科目</span><span></span></div>
  <div id="subjectCards" class="cards"></div>
  <div class="prog-hint">年級在右上角選（可多選），隨時可換。國語以外的科目題庫建置中。</div>
</section>

<!-- 首頁 -->
<section id="view-home" class="view">

  <div class="cards">
    <button class="card card-wide card-daily" data-go="daily">
      <span class="card-icon">📅</span><span class="card-title">每日練習</span>
      <span class="card-sub" id="cnt-daily"></span>
    </button>
    <button class="card" data-go="idioms">
      <span class="card-icon">📜</span><span class="card-title">成語</span>
      <span class="card-sub" id="cnt-idioms"></span>
    </button>
    <button class="card" data-go="slang">
      <span class="card-icon">🗣️</span><span class="card-title">俚語諺語</span>
      <span class="card-sub" id="cnt-slang"></span>
    </button>
    <button class="card" data-go="phonics">
      <span class="card-icon">🔊</span><span class="card-title">字音辨正</span>
      <span class="card-sub" id="cnt-phonics"></span>
    </button>
    <button class="card" data-go="chars">
      <span class="card-icon">✍️</span><span class="card-title">字形辨正</span>
      <span class="card-sub" id="cnt-chars"></span>
    </button>
    <button class="card" data-go="drill">
      <span class="card-icon">📶</span><span class="card-title">依序刷題</span>
      <span class="card-sub" id="cnt-drill"></span>
    </button>
    <button class="card" data-go="custom">
      <span class="card-icon">📂</span><span class="card-title">自創題庫</span>
      <span class="card-sub" id="cnt-custom"></span>
    </button>
    <button class="card" data-go="units">
      <span class="card-icon">🧭</span><span class="card-title">單元學習</span>
      <span class="card-sub" id="cnt-units"></span>
    </button>
    <button class="card" data-go="reading">
      <span class="card-icon">📖</span><span class="card-title">閱讀測驗</span>
      <span class="card-sub" id="cnt-reading"></span>
    </button>
    <button class="card" data-go="write">
      <span class="card-icon">🖌️</span><span class="card-title">手寫練習</span>
      <span class="card-sub">看注音寫國字</span>
    </button>
    <button class="card" data-go="flash">
      <span class="card-icon">🗂️</span><span class="card-title">字卡複習</span>
      <span class="card-sub" id="cnt-flash"></span>
    </button>
    <button class="card" data-go="writing">
      <span class="card-icon">🖋️</span><span class="card-title">寫作素材</span>
      <span class="card-sub" id="cnt-writing"></span>
    </button>
    <button class="card" data-go="wrongbook">
      <span class="card-icon">📕</span><span class="card-title">錯題本</span>
      <span class="card-sub" id="cnt-wrong"></span>
    </button>
    <button class="card" data-go="progress">
      <span class="card-icon">📈</span><span class="card-title">學習進度</span>
      <span class="card-sub" id="cnt-streak"></span>
    </button>
  </div>
  <div id="homePlaceholder" class="empty hidden"></div>
</section>

<!-- 選擇題測驗 -->
<section id="view-quiz" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="quizExit">✕ 離開</button>
    <span id="quizProgress"></span>
    <span id="quizCombo" class="q-combo"></span>
    <span id="quizScore"></span>
  </div>
  <div class="qbar-track"><div id="quizBar" class="qbar"></div></div>
  <div class="quiz-card">
    <div id="quizTag" class="q-tag"></div>
    <div id="quizPassage" class="q-passage hidden"></div>
    <div id="quizQuestion" class="q-text"></div>
    <div id="quizOptions" class="q-options"></div>
    <div id="quizFeedback" class="q-feedback hidden"></div>
    <div class="write-btns">
      <button id="quizPrev" class="btn-ghost hidden">← 上一題</button>
      <button id="quizGuess" class="btn-ghost hidden"></button>
      <button id="quizNext" class="btn-primary hidden">下一題</button>
    </div>
  </div>
  <div id="quizResult" class="quiz-result hidden"></div>
</section>

<!-- 手寫練習 -->
<section id="view-write" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="writeExit">✕ 離開</button>
    <span id="writeProgress"></span>
    <span id="writeScore"></span>
  </div>
  <div class="quiz-card">
    <div id="writeTag" class="q-tag"></div>
    <div id="writePrompt" class="q-text"></div>
    <div class="canvas-wrap">
      <canvas id="writeCanvas" width="280" height="280"></canvas>
      <div id="writeAnswer" class="write-answer hidden"></div>
    </div>
    <div id="strokeWrap" class="stroke-wrap hidden">
      <div id="strokePanel" class="stroke-panel"></div>
      <button id="strokeReplay" class="btn-ghost">▶ 重播筆順</button>
    </div>
    <div class="write-btns">
      <button id="writeClear" class="btn-ghost">清除重寫</button>
      <button id="writeReveal" class="btn-primary">顯示答案</button>
    </div>
    <div id="writeJudge" class="write-btns hidden">
      <button id="writeRight" class="btn-good">✓ 我寫對了</button>
      <button id="writeWrong" class="btn-bad">✗ 我寫錯了</button>
    </div>
    <div id="writeNote" class="q-feedback hidden"></div>
  </div>
  <div id="writeResult" class="quiz-result hidden"></div>
</section>

<!-- 字卡複習 -->
<section id="view-flash" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="flashExit">✕ 離開</button>
    <span id="flashInfo"></span>
  </div>
  <div id="flashEmpty" class="empty hidden">今天沒有到期的字卡 🎉<br><small>字卡採三盒間隔複習：盒1每天、盒2每2天、盒3每5天。答錯的選擇題會自動加入盒1。</small></div>
  <div id="flashCard" class="flash-card">
    <div id="flashFront" class="flash-face"></div>
    <div id="flashBack" class="flash-face hidden"></div>
  </div>
  <div class="write-btns">
    <button id="flashFlip" class="btn-primary">翻面</button>
  </div>
  <div id="flashJudge" class="write-btns hidden">
    <button id="flashKnow" class="btn-good">✓ 記得</button>
    <button id="flashForget" class="btn-bad">✗ 忘記</button>
  </div>
</section>

<!-- 錯題本 -->
<section id="view-wrongbook" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="wrongExit">✕ 返回</button>
    <span>錯題本</span>
    <button class="btn-ghost" id="wrongRetry">重練全部</button>
  </div>
  <div id="wrongFilters" class="gp-quick unit-grades"></div>
  <div id="wrongTools" class="wb-tools"></div>
  <div id="wrongList" class="wrong-list"></div>
</section>

<!-- 單元學習 -->
<section id="view-units" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="unitsExit">✕ 返回</button>
    <span>單元學習</span>
    <span></span>
  </div>
  <div id="unitSizeRow" class="gp-quick"></div>
  <div id="unitGradeRow" class="gp-quick unit-grades"></div>
  <div id="unitList" class="wrong-list"></div>
</section>

<!-- 單元教學 -->
<section id="view-lesson" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="lessonExit">✕ 離開</button>
    <span id="lessonInfo"></span>
    <span></span>
  </div>
  <div class="quiz-card">
    <div id="lessonTag" class="q-tag"></div>
    <div id="lessonBody" class="lesson-body"></div>
    <div class="write-btns">
      <button id="lessonPrev" class="btn-ghost">← 上一個</button>
      <button id="lessonNext" class="btn-primary">下一個 →</button>
    </div>
  </div>
</section>

<!-- 自創題庫（分冊分課） -->
<section id="view-custom" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="customExit">✕ 返回</button>
    <span>自創題庫</span>
    <span></span>
  </div>
  <div id="customBooks" class="gp-quick unit-grades"></div>
  <div id="customDiffs" class="gp-quick"></div>
  <div id="customTypes" class="gp-quick unit-grades"></div>
  <div id="customList" class="wrong-list"></div>
</section>

<!-- 依序刷題 -->
<section id="view-drill" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="drillExit">✕ 返回</button>
    <span>依序刷題</span>
    <span></span>
  </div>
  <div id="drillList" class="wrong-list"></div>
</section>

<!-- 寫作素材 -->
<section id="view-writing" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="writingExit">✕ 返回</button>
    <span>寫作素材</span>
    <span></span>
  </div>
  <div class="quiz-card">
    <div id="wrTag" class="q-tag"></div>
    <div id="wrQuote" class="wr-quote"></div>
    <div id="wrSrc" class="wr-src"></div>
    <div id="wrTip" class="q-feedback"></div>
    <div id="wrPrompt" class="q-text"></div>
    <textarea id="wrInput" class="wr-input" rows="4" placeholder="用今天這句話的句式或精神，寫一段自己的文字……"></textarea>
    <button id="wrSave" class="btn-primary">儲存今日仿寫</button>
  </div>
  <div id="wrHistory" class="wrong-list"></div>
</section>

<!-- 進度 -->
<section id="view-progress" class="view hidden">
  <div class="quiz-head">
    <button class="btn-ghost" id="progExit">✕ 返回</button>
    <span>學習進度</span>
    <button class="btn-ghost" id="progReset">清除資料</button>
  </div>
  <div id="progBody" class="prog-body"></div>
</section>
</main>

<script src="js/data/idioms.js"></script>
<script src="js/data/slang.js"></script>
<script src="js/data/phonics.js"></script>
<script src="js/data/chars.js"></script>
<script src="js/data/reading.js"></script>
<script src="js/data/writing.js"></script>
<script src="js/data/custom.js"></script>
<script src="js/data/subjects.js"></script>
<script src="js/vendor/hanzi-writer.min.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
